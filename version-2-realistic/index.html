<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>A Terrible Day at the Office — Version 2.1</title>

  <!-- A-Frame renders the 3D scene. -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR detects the office image target and anchors the A-Frame scene to it. -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Keep the AR camera view full-screen. */
    html,
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Prevent the browser from interpreting drags as page scrolling or zooming. */
    canvas {
      touch-action: none;
    }

    /* Instruction and progress panel. It does not intercept touch interaction. */
    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      width: min(360px, calc(100vw - 48px));
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 14px;
      box-shadow: 0 7px 24px rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    #title {
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: 700;
    }

    #message {
      min-height: 38px;
      line-height: 1.35;
    }

    #progress {
      margin-top: 8px;
      font-weight: 700;
    }

    #success {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      background: #e5f7e9;
      border-radius: 9px;
      font-weight: 700;
    }

    #reset {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 1001;
      border: 0;
      border-radius: 999px;
      padding: 11px 15px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      font-weight: 700;
    }
  </style>

  <script>
    /* -----------------------------------------------------------------------
       APPLICATION STATE
       -----------------------------------------------------------------------
       task = 0: throw the paper into the bin
       task = 1: move the mug to the coaster
       task = 2: remove the jammed paper
       task = 3: all tasks completed
    ----------------------------------------------------------------------- */
    const state = {
      task: 0,
      total: 3,
      targetVisible: false,
      printerRunning: false
    };

    /* Small helper functions for updating the HTML overlay. */
    function showMessage(text) {
      document.querySelector("#message").textContent = text;
    }

    function updateProgress() {
      document.querySelector("#progress").textContent =
        `Tasks completed: ${state.task}/${state.total}`;
    }

    /* -----------------------------------------------------------------------
       TASK PROGRESSION
       -----------------------------------------------------------------------
       This function is the single place where the application moves from one
       task to the next. Keeping progression logic centralized makes it easier
       to add personalization or branching tasks later.
    ----------------------------------------------------------------------- */
    function completeTask(taskNumber) {
      // Ignore accidental or out-of-order completions.
      if (state.task !== taskNumber - 1) return;

      state.task = taskNumber;
      updateProgress();

      if (taskNumber === 1) {
        document.querySelector("#paper").setAttribute("visible", false);
        document.querySelector("#bin-highlight").setAttribute("visible", false);
        document.querySelector("#cup").setAttribute("visible", true);
        document.querySelector("#coaster-highlight").setAttribute("visible", true);
        showMessage("Good throw! Drag the coffee mug onto the coaster.");
      }

      if (taskNumber === 2) {
        document.querySelector("#cup").setAttribute("visible", false);
        document.querySelector("#coaster-highlight").setAttribute("visible", false);
        document.querySelector("#jammed-paper").setAttribute("visible", true);
        document.querySelector("#jam-highlight").setAttribute("visible", true);
        showMessage("The printer is jammed. Pull the flashing sheet completely out.");
      }

      if (taskNumber === 3) {
        document.querySelector("#jammed-paper").setAttribute("visible", false);
        document.querySelector("#jam-highlight").setAttribute("visible", false);
        document.querySelector("#printer-light").setAttribute("color", "#49b96f");
        document.querySelector("#success").style.display = "block";
        state.printerRunning = false;
        showMessage("Excellent! The office is under control again.");
      }
    }

    /* Convert a pointer coordinate from browser pixels to Three.js Normalized
       Device Coordinates. The raycaster uses the range -1 to +1. */
    function pointerToNDC(event, canvas, outputVector) {
      const rectangle = canvas.getBoundingClientRect();

      outputVector.set(
        ((event.clientX - rectangle.left) / rectangle.width) * 2 - 1,
        -((event.clientY - rectangle.top) / rectangle.height) * 2 + 1
      );
    }

    /* -----------------------------------------------------------------------
       GLB DIAGNOSTICS
       -----------------------------------------------------------------------
       These listeners make missing files or loading problems visible in the
       browser console and in the instruction panel.
    ----------------------------------------------------------------------- */
    AFRAME.registerComponent("report-model-status", {
      init() {
        this.el.addEventListener("model-loaded", () => {
          console.info(`Loaded model: ${this.el.getAttribute("gltf-model")}`);
        });

        this.el.addEventListener("model-error", (event) => {
          console.error("Could not load GLB model:", event.detail);
          showMessage("A 3D model could not be loaded. Check the file paths and console.");
        });
      }
    });

    /* -----------------------------------------------------------------------
       PRINTER BEHAVIOUR
       -----------------------------------------------------------------------
       The realistic printer GLB is only the visible shell. The status light,
       paper outlet and animated sheets remain separate A-Frame entities. This
       separation lets us change the artwork without rewriting the behaviour.
    ----------------------------------------------------------------------- */
    AFRAME.registerComponent("printer-behaviour", {
      init() {
        this.elapsed = 0;
        this.sheetNumber = 0;
      },

      tick(time, delta) {
        if (!state.targetVisible || !state.printerRunning || state.task >= 3) return;

        this.elapsed += delta;

        // Emit a temporary sheet approximately every 2.3 seconds.
        if (this.elapsed > 2300) {
          this.elapsed = 0;
          this.emitSheet();
        }
      },

      emitSheet() {
        const output = document.querySelector("#printer-output");
        const sheet = document.createElement("a-plane");

        this.sheetNumber += 1;

        // These sheets are deliberately simple planes. They are short-lived
        // visual effects, so loading a full GLB for each one would be wasteful.
        sheet.setAttribute("width", ".16");
        sheet.setAttribute("height", ".105");
        sheet.setAttribute("color", this.sheetNumber % 2 ? "#fffef5" : "#eef4ff");
        sheet.setAttribute("position", "0 0 0");
        sheet.setAttribute("material", "side:double;transparent:true");

        sheet.setAttribute(
          "animation__print",
          "property:position;from:0 0 0;to:0 -.13 .035;dur:900;easing:easeOutQuad"
        );
        sheet.setAttribute(
          "animation__fall",
          "property:rotation;from:0 0 0;to:20 0 8;dur:650;delay:760;easing:easeInQuad"
        );
        sheet.setAttribute(
          "animation__fade",
          "property:material.opacity;from:1;to:0;dur:500;delay:1600"
        );

        output.appendChild(sheet);
        setTimeout(() => sheet.remove(), 2200);
      }
    });

    /* -----------------------------------------------------------------------
       THROWABLE PAPER
       -----------------------------------------------------------------------
       The parent entity owns the interaction and motion. Its children contain:
       1. the visible GLB model; and
       2. an invisible, simple box used as a generous touch target.

       This is the same collider/rendering separation used in many game engines.
    ----------------------------------------------------------------------- */
    AFRAME.registerComponent("throwable-paper", {
      schema: {
        bin: { type: "selector" }
      },

      init() {
        this.scene = this.el.sceneEl;
        this.target = document.querySelector("#target");
        this.surface = document.querySelector("#interaction-surface");

        this.pointer = new THREE.Vector2();
        this.raycaster = new THREE.Raycaster();
        this.dragging = false;
        this.flying = false;
        this.velocity = new THREE.Vector3();
        this.samples = [];
        this.startPosition = this.el.object3D.position.clone();

        this.onPointerDown = this.onPointerDown.bind(this);
        this.onPointerMove = this.onPointerMove.bind(this);
        this.onPointerUp = this.onPointerUp.bind(this);

        this.scene.addEventListener("renderstart", () => {
          this.canvas = this.scene.canvas;
          this.canvas.addEventListener("pointerdown", this.onPointerDown);
          this.canvas.addEventListener("pointermove", this.onPointerMove);
          this.canvas.addEventListener("pointerup", this.onPointerUp);
          this.canvas.addEventListener("pointercancel", this.onPointerUp);
        });
      },

      /* Return true when the pointer ray intersects either the GLB or collider. */
      pointerHitsObject(event) {
        pointerToNDC(event, this.canvas, this.pointer);
        this.raycaster.setFromCamera(this.pointer, this.scene.camera);
        return this.raycaster.intersectObject(this.el.object3D, true).length > 0;
      },

      /* Project the pointer onto the invisible interaction plane. This converts
         2D screen dragging into a 3D position anchored to the image target. */
      pointerOnSurface(event) {
        pointerToNDC(event, this.canvas, this.pointer);
        this.raycaster.setFromCamera(this.pointer, this.scene.camera);

        const mesh = this.surface.getObject3D("mesh");
        if (!mesh) return null;

        const intersections = this.raycaster.intersectObject(mesh, true);
        if (!intersections.length) return null;

        const localPoint = intersections[0].point.clone();
        this.target.object3D.worldToLocal(localPoint);
        return localPoint;
      },

      onPointerDown(event) {
        if (state.task !== 0 || !state.targetVisible || !this.pointerHitsObject(event)) return;

        event.preventDefault();
        this.dragging = true;
        this.flying = false;
        this.samples = [];

        // The idle animation changes position continuously. Remove it while the
        // user is dragging, otherwise it would overwrite the drag position.
        this.el.removeAttribute("animation__idle");

        // Scale the parent, so both model and collider move together.
        this.el.setAttribute(
          "animation__pickup",
          "property:scale;to:1.18 1.18 1.18;dur:120"
        );

        showMessage("Drag quickly toward the bin and release to throw.");
      },

      onPointerMove(event) {
        if (!this.dragging) return;

        event.preventDefault();
        const point = this.pointerOnSurface(event);
        if (!point) return;

        const x = THREE.MathUtils.clamp(point.x, -0.48, 0.48);
        const y = THREE.MathUtils.clamp(point.y, -0.34, 0.34);

        this.el.object3D.position.set(x, y, 0.16);

        // Slight rotation makes the direct manipulation feel less mechanical.
        this.el.object3D.rotation.set(
          THREE.MathUtils.degToRad(12 + y * 25),
          THREE.MathUtils.degToRad(x * 30),
          THREE.MathUtils.degToRad(-x * 50)
        );

        // Keep a short motion history. Release velocity is estimated from it.
        this.samples.push({
          point: new THREE.Vector3(x, y, 0.16),
          time: performance.now()
        });

        if (this.samples.length > 5) this.samples.shift();
      },

      onPointerUp(event) {
        if (!this.dragging) return;

        event.preventDefault();
        this.dragging = false;
        this.flying = true;

        const last = this.samples[this.samples.length - 1];
        const first = this.samples[0];

        if (last && first && last.time > first.time) {
          const seconds = (last.time - first.time) / 1000;
          this.velocity.copy(last.point).sub(first.point).divideScalar(seconds);

          // Limit extreme velocities caused by very short pointer movements.
          if (this.velocity.length() > 1.8) this.velocity.setLength(1.8);
        } else {
          this.velocity.set(0.35, 0.25, 0);
        }

        // Add a small upward and outward impulse.
        this.velocity.y += 0.20;
        this.velocity.z = 0.12;

        this.el.removeAttribute("animation__pickup");
        this.el.setAttribute(
          "animation__scale",
          "property:scale;to:1 1 1;dur:120"
        );
      },

      tick(time, delta) {
        if (!this.flying || !state.targetVisible) return;

        const dt = Math.min(delta / 1000, 0.035);

        // Lightweight scripted physics: gravity plus gentle drag.
        this.velocity.y -= 1.15 * dt;
        this.velocity.x *= 0.992;
        this.velocity.z *= 0.985;

        this.el.object3D.position.addScaledVector(this.velocity, dt);
        this.el.object3D.rotation.x += dt * 5;
        this.el.object3D.rotation.z += dt * 7;

        const paperPosition = this.el.object3D.position;
        const binPosition = this.data.bin.object3D.position;
        const distance = Math.hypot(
          paperPosition.x - binPosition.x,
          paperPosition.y - binPosition.y
        );

        // A forgiving success zone is better for touch interaction on phones.
        if (distance < 0.12 && paperPosition.y < binPosition.y + 0.10) {
          this.flying = false;

          this.el.setAttribute(
            "animation__drop",
            `property:position;to:${binPosition.x} ${binPosition.y - 0.05} .04;dur:300;easing:easeInQuad`
          );
          this.el.setAttribute(
            "animation__shrink",
            "property:scale;to:0 0 0;dur:260;delay:150"
          );

          // Give the bin a short response animation as immediate feedback.
          this.data.bin.setAttribute(
            "animation__feedback",
            "property:scale;from:1 1 1;to:1.12 .92 1.12;dur:130;dir:alternate;loop:2"
          );

          setTimeout(() => completeTask(1), 450);
          return;
        }

        // Reset the paper after a missed throw.
        if (paperPosition.y < -0.55 || Math.abs(paperPosition.x) > 0.72) {
          this.flying = false;
          this.el.object3D.position.copy(this.startPosition);
          this.el.object3D.rotation.set(0, 0, 0);
          this.el.object3D.scale.set(1, 1, 1);

          // Restore the subtle motion hint after the reset.
          this.el.setAttribute(
            "animation__idle",
            "property:position;from:-.12 -.18 .16;to:-.12 -.16 .16;dur:850;dir:alternate;loop:true;easing:easeInOutSine"
          );

          showMessage("The paper missed the bin. Try another throw.");
        }
      }
    });

    /* -----------------------------------------------------------------------
       REUSABLE DRAG-TO-ZONE COMPONENT
       -----------------------------------------------------------------------
       Used by both the coffee mug and jammed paper. The visible model and the
       invisible collider are children of the same draggable parent entity.
    ----------------------------------------------------------------------- */
    AFRAME.registerComponent("drag-to-zone", {
      schema: {
        zone: { type: "selector" },
        requiredTask: { type: "int" },
        threshold: { type: "number", default: 0.13 },
        successTask: { type: "int" }
      },

      init() {
        this.scene = this.el.sceneEl;
        this.target = document.querySelector("#target");
        this.surface = document.querySelector("#interaction-surface");

        this.pointer = new THREE.Vector2();
        this.raycaster = new THREE.Raycaster();
        this.dragging = false;
        this.startPosition = this.el.object3D.position.clone();

        this.onPointerDown = this.onPointerDown.bind(this);
        this.onPointerMove = this.onPointerMove.bind(this);
        this.onPointerUp = this.onPointerUp.bind(this);

        this.scene.addEventListener("renderstart", () => {
          this.canvas = this.scene.canvas;
          this.canvas.addEventListener("pointerdown", this.onPointerDown);
          this.canvas.addEventListener("pointermove", this.onPointerMove);
          this.canvas.addEventListener("pointerup", this.onPointerUp);
          this.canvas.addEventListener("pointercancel", this.onPointerUp);
        });
      },

      pointerHitsObject(event) {
        pointerToNDC(event, this.canvas, this.pointer);
        this.raycaster.setFromCamera(this.pointer, this.scene.camera);
        return this.raycaster.intersectObject(this.el.object3D, true).length > 0;
      },

      pointerOnSurface(event) {
        pointerToNDC(event, this.canvas, this.pointer);
        this.raycaster.setFromCamera(this.pointer, this.scene.camera);

        const mesh = this.surface.getObject3D("mesh");
        if (!mesh) return null;

        const intersections = this.raycaster.intersectObject(mesh, true);
        if (!intersections.length) return null;

        const localPoint = intersections[0].point.clone();
        this.target.object3D.worldToLocal(localPoint);
        return localPoint;
      },

      onPointerDown(event) {
        const isCorrectTask = state.task === this.data.requiredTask;
        const isVisible = this.el.getAttribute("visible");

        if (!isCorrectTask || !state.targetVisible || !isVisible || !this.pointerHitsObject(event)) {
          return;
        }

        event.preventDefault();
        this.dragging = true;

        this.el.setAttribute(
          "animation__pickup",
          "property:scale;to:1.10 1.10 1.10;dur:120"
        );
      },

      onPointerMove(event) {
        if (!this.dragging) return;

        event.preventDefault();
        const point = this.pointerOnSurface(event);
        if (!point) return;

        this.el.object3D.position.set(
          THREE.MathUtils.clamp(point.x, -0.47, 0.47),
          THREE.MathUtils.clamp(point.y, -0.33, 0.33),
          0.16
        );
      },

      onPointerUp(event) {
        if (!this.dragging) return;

        event.preventDefault();
        this.dragging = false;

        const objectPosition = this.el.object3D.position;
        const zonePosition = this.data.zone.object3D.position;
        const distance = Math.hypot(
          objectPosition.x - zonePosition.x,
          objectPosition.y - zonePosition.y
        );

        if (distance < this.data.threshold) {
          this.el.setAttribute(
            "animation__place",
            `property:position;to:${zonePosition.x} ${zonePosition.y} .12;dur:320;easing:easeOutBack`
          );

          setTimeout(() => completeTask(this.data.successTask), 350);
        } else {
          this.el.setAttribute(
            "animation__return",
            `property:position;to:${this.startPosition.x} ${this.startPosition.y} ${this.startPosition.z};dur:400;easing:easeOutBack`
          );
          this.el.setAttribute(
            "animation__normal",
            "property:scale;to:1 1 1;dur:160"
          );

          showMessage(
            this.data.requiredTask === 1
              ? "Place the mug inside the glowing coaster."
              : "Pull the jammed sheet farther away from the printer."
          );
        }
      }
    });
  </script>
</head>

<body>
  <!-- Standard HTML overlay shown above the AR canvas. -->
  <div id="panel">
    <div id="title">A Terrible Day at the Office — Version 2.1</div>
    <div id="message">Starting MindAR…</div>
    <div id="progress">Tasks completed: 0/3</div>
    <div id="success">✓ All three problems are resolved!</div>
  </div>

  <button id="reset" onclick="location.reload()">Restart</button>

  <!--
    IMPORTANT: Copy your existing compiled MindAR target file to:
    assets/targets/office-target.mind
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets/office-target.mind; warmupTolerance: 1; missTolerance: 5;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="colorManagement:true; physicallyCorrectLights:true"
  >
    <!-- Preload all GLB files before the AR experience starts. -->
    <a-assets timeout="30000">
      <a-asset-item id="bin-model" src="./assets/models/bin.glb"></a-asset-item>
      <a-asset-item id="cup-model" src="./assets/models/coffee-mug.glb"></a-asset-item>
      <a-asset-item id="paper-model" src="./assets/models/paper.glb"></a-asset-item>
      <a-asset-item id="printer-model" src="./assets/models/printer.glb"></a-asset-item>
    </a-assets>

    <!-- The camera is controlled by MindAR, not by mouse/touch look controls. -->
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- Everything inside this entity is anchored to image target index 0. -->
    <a-entity id="target" mindar-image-target="targetIndex:0">

      <!--
        Invisible plane used to map 2D pointer movement to positions on the
        office target. It is not itself an interactive object.
      -->
      <a-plane
        id="interaction-surface"
        width="1"
        height=".75"
        position="0 0 .02"
        material="transparent:true;opacity:0;depthWrite:false"
      ></a-plane>

      <!-- Subtle desk/stage base. Remove this box if the target image already
           provides enough visual context and you prefer full camera visibility. -->
      <a-box
        width="1"
        height=".72"
        depth=".025"
        position="0 0 .025"
        color="#a9825d"
        material="roughness:.82;metalness:.02"
      ></a-box>

      <!-- ===================================================================
           REALISTIC BIN
           Parent: semantic object and feedback animation.
           Child 1: visible GLB.
           Child 2: transparent collider/touch target.
      ==================================================================== -->
      <a-entity id="bin" position=".37 -.23 .13">
        <a-gltf-model
          src="#bin-model"
          scale=".35 .35 .35"
          position="0 -.07 0"
          report-model-status
        ></a-gltf-model>

        <!-- Opacity is almost zero rather than visible=false so raycasting can
             still use the geometry reliably across browsers. -->
        <a-cylinder
          radius=".105"
          height=".19"
          rotation="90 0 0"
          position="0 0 .01"
          material="transparent:true;opacity:.001;depthWrite:false"
        ></a-cylinder>
      </a-entity>

      <!-- Persistent visual cue for Task 1. -->
      <a-ring
        id="bin-highlight"
        radius-inner=".105"
        radius-outer=".128"
        position=".37 -.23 .235"
        color="#50d276"
        animation="property:scale;from:.9 .9 .9;to:1.15 1.15 1.15;dur:700;dir:alternate;loop:true"
      ></a-ring>

      <!-- ===================================================================
           REALISTIC THROWABLE PAPER
           The downloaded paper model uses a different native scale from the
           scene, so only the child GLB receives the model-specific scale.
           The parent remains at scale 1 for predictable interaction animation.
      ==================================================================== -->
      <a-entity
        id="paper"
        position="-.12 -.18 .16"
        throwable-paper="bin:#bin"
        animation__idle="property:position;from:-.12 -.18 .16;to:-.12 -.16 .16;dur:850;dir:alternate;loop:true;easing:easeInOutSine"
      >
        <a-gltf-model
          src="#paper-model"
          scale=".20 .20 .20"
          rotation="18 0 -15"
          report-model-status
        ></a-gltf-model>

        <!-- Larger than the visible model to make touch selection forgiving. -->
        <a-box
          width=".13"
          height=".12"
          depth=".09"
          material="transparent:true;opacity:.001;depthWrite:false"
        ></a-box>
      </a-entity>

      <!-- ===================================================================
           COASTER / DROP ZONE
      ==================================================================== -->
      <a-cylinder
        id="coaster"
        radius=".09"
        height=".012"
        position="-.32 -.20 .09"
        rotation="90 0 0"
        color="#364b5f"
        material="roughness:.65"
      ></a-cylinder>

      <a-ring
        id="coaster-highlight"
        radius-inner=".09"
        radius-outer=".115"
        position="-.32 -.20 .105"
        visible="false"
        color="#55c8ff"
        animation="property:scale;from:.92 .92 .92;to:1.14 1.14 1.14;dur:700;dir:alternate;loop:true"
      ></a-ring>

      <!-- ===================================================================
           REALISTIC COFFEE MUG
           This source model is approximately 40–50 times larger than the other
           assets, so it requires a much smaller child scale.
      ==================================================================== -->
      <a-entity
        id="cup"
        position=".02 -.07 .16"
        visible="false"
        drag-to-zone="zone:#coaster;requiredTask:1;threshold:.14;successTask:2"
      >
        <a-gltf-model
          src="#cup-model"
          scale=".0057 .0057 .0057"
          rotation="0 25 0"
          report-model-status
        ></a-gltf-model>

        <!-- Simple cylinder collider; easier to touch than the mug handle. -->
        <a-cylinder
          radius=".075"
          height=".13"
          rotation="90 0 0"
          material="transparent:true;opacity:.001;depthWrite:false"
        ></a-cylinder>
      </a-entity>

      <!-- ===================================================================
           REALISTIC PRINTER
           The model is static. Behavioural elements are separate children:
           status LED, paper outlet and generated sheets.
      ==================================================================== -->
      <a-entity id="printer" printer-behaviour position=".20 .15 .14">
        <a-gltf-model
          src="#printer-model"
          scale=".68 .68 .68"
          rotation="0 180 0"
          position="0 -.005 0"
          report-model-status
        ></a-gltf-model>

        <!-- Red while jammed; changed to green after Task 3. -->
        <a-sphere
          id="printer-light"
          radius=".012"
          position=".11 .055 .135"
          color="#ef4c4c"
          material="emissive:#ef4c4c;emissiveIntensity:.8"
          animation="property:material.opacity;from:.25;to:1;dur:400;dir:alternate;loop:true"
        ></a-sphere>

        <!-- Temporary printed sheets are appended here by printer-behaviour. -->
        <a-entity id="printer-output" position="0 -.055 .145"></a-entity>
      </a-entity>

      <!-- ===================================================================
           REALISTIC JAMMED PAPER
           Uses the same paper GLB, but with a flatter non-uniform scale to make
           it read more like a sheet protruding from the printer.
      ==================================================================== -->
      <a-entity
        id="jammed-paper"
        position=".20 .055 .255"
        rotation="0 0 -5"
        visible="false"
        drag-to-zone="zone:#paper-clear-zone;requiredTask:2;threshold:.17;successTask:3"
      >
        <a-gltf-model
          src="#paper-model"
          scale=".22 .16 .07"
          report-model-status
        ></a-gltf-model>

        <a-box
          width=".22"
          height=".15"
          depth=".045"
          material="transparent:true;opacity:.001;depthWrite:false"
        ></a-box>
      </a-entity>

      <a-ring
        id="jam-highlight"
        radius-inner=".11"
        radius-outer=".135"
        position=".20 .055 .27"
        visible="false"
        color="#ffb84d"
        animation="property:scale;from:.88 .88 .88;to:1.16 1.16 1.16;dur:620;dir:alternate;loop:true"
      ></a-ring>

      <!-- Invisible success zone: the sheet must be dragged away from printer. -->
      <a-circle
        id="paper-clear-zone"
        radius=".08"
        position="-.08 .15 .11"
        material="transparent:true;opacity:0"
      ></a-circle>

      <!-- Small decorative desk accessories. These remain primitives for now;
           they are lightweight and visually support the modern-office scene. -->
      <a-box
        width=".12"
        height=".05"
        depth=".08"
        position="-.34 .19 .10"
        color="#4d718d"
        material="roughness:.75"
      ></a-box>
      <a-box
        width=".10"
        height=".04"
        depth=".07"
        position="-.34 .19 .145"
        color="#f1d26a"
        material="roughness:.75"
      ></a-box>
      <a-cylinder
        radius=".025"
        height=".16"
        position="-.43 .15 .17"
        color="#3c8c5b"
        material="roughness:.8"
      ></a-cylinder>
    </a-entity>
  </a-scene>

  <script>
    /* -----------------------------------------------------------------------
       MINDAR LIFECYCLE EVENTS
       ----------------------------------------------------------------------- */
    document.addEventListener("DOMContentLoaded", () => {
      const scene = document.querySelector("a-scene");
      const target = document.querySelector("#target");

      scene.addEventListener("arReady", () => {
        showMessage("Camera ready. Show the office target image.");
      });

      scene.addEventListener("arError", () => {
        showMessage("MindAR could not start. Check camera permission, HTTPS and target path.");
      });

      target.addEventListener("targetFound", () => {
        state.targetVisible = true;
        state.printerRunning = true;

        if (state.task === 0) {
          showMessage("Throw the paper into the waste bin.");
        } else if (state.task === 1) {
          showMessage("Drag the coffee mug onto the glowing coaster.");
        } else if (state.task === 2) {
          showMessage("Pull the jammed paper completely out of the printer.");
        } else {
          showMessage("The office is under control.");
        }
      });

      target.addEventListener("targetLost", () => {
        state.targetVisible = false;
        showMessage("Target lost. Show the complete office image again.");
      });
    });
  </script>
</body>
</html>
