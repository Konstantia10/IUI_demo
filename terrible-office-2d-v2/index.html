<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Terrible Day at the Office — Interactive</title><link rel="stylesheet" href="styles.css"></head><body data-intent="supportive">
<header><div><h1>A Terrible Day at the Office</h1><p>Interactive 2D intelligent workplace assistant</p></div><label>Design intent <select id="intent"><option value="supportive">Supportive</option><option value="persuasive">Persuasive</option><option value="manipulative">Manipulative</option></select></label></header>
<main><section class="scene-wrap"><div class="scene" id="scene"><img src="assets/office-poster.jpg" alt="Cluttered office desk"><div class="live-clock" id="clock">--:--</div>
<button class="hot phone" data-object="phone">Phone</button><button class="hot monitor" data-object="monitor">Monitor</button><button class="hot coffee" data-object="coffee">Coffee</button><button class="hot tasks" data-object="tasks">To-do</button><button class="hot papers" data-object="papers">Documents</button>
<button id="paper" class="scene-action paper-one" type="button" aria-label="Lower crumpled paper. Drag it into the waste bin."><span>Paper 1</span></button>
<button id="paper2" class="scene-action paper-two" type="button" aria-label="Upper crumpled paper. Drag it into the waste bin." hidden><span>Paper 2</span></button>
<button id="tissue" class="scene-action tissue" type="button" aria-label="Take a tissue" hidden><span>Take tissue</span></button>
<button id="spill" class="scene-action spill" type="button" aria-label="Coffee spill. Clean it with the selected tissue." hidden><span>Clean spill</span></button>
<button id="mug" class="scene-action mug-action" type="button" aria-label="Fallen coffee mug. Put it upright." hidden><span>Stand mug up</span></button>
<button id="documentStack" class="scene-action document-stack" type="button" aria-label="Document stack. Drag it onto the shelf." hidden><span>Documents</span></button>
<div id="bin" class="drop-target drop-bin" role="button" tabindex="0" aria-label="Waste bin">BIN</div><div id="shelf" class="drop-target shelf-target" role="button" tabindex="0" aria-label="Shelf for documents" hidden>SHELF</div></div><p class="hint" id="sceneHint">Drag the lower crumpled paper into the bin.</p></section>
<section class="cards"><article><h2>Cleanup tasks</h2><label><input id="taskPapers" type="checkbox" disabled> Dispose of both papers</label><label><input id="taskCoffee" type="checkbox" disabled> Clean coffee and stand mug upright</label><label><input id="taskDocuments" type="checkbox" disabled> Put documents on shelf</label></article><article><h2>Status</h2><p id="status">The office is busy. Explore the scene.</p><button id="undo" class="secondary">Undo last action</button></article></section>
<section class="assistant"><div class="assistant-head"><div><strong>Office Assistant</strong><span id="modeBadge">Supportive mode</span></div><button id="dismiss" class="secondary">Dismiss</button></div><div id="messages" class="messages" aria-live="polite"><div class="bubble">Good morning. What would you like help with?</div></div><div id="choiceArea" class="choices"></div><div class="quick"><button data-cmd="meeting">Meeting</button><button data-cmd="documents">Documents</button><button data-cmd="focus">Focus</button><button data-cmd="coffee">Coffee</button></div><div class="chat"><input id="input" placeholder="Ask your assistant…"><button id="send">Send</button></div></section>
</main><script src="app.js"></script></body></html>
