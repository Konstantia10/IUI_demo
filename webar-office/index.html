<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no"
  />

  <title>Terrible Day at the Office – WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    canvas {
      touch-action: none;
    }

    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;

      width: min(310px, calc(100vw - 48px));
      padding: 15px;

      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);

      pointer-events: none;
    }

    #title {
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    #message {
      line-height: 1.4;
    }

    #progress {
      margin-top: 10px;
      font-weight: bold;
    }

    #success {
      display: none;

      margin-top: 10px;
      padding: 8px;

      background: #e4f7e8;
      border-radius: 8px;

      font-weight: bold;
    }
  </style>

  <script>
    /*
     * Component that allows the paper to be dragged
     * across the tracked image.
     */
    AFRAME.registerComponent("drag-paper", {
      init: function () {
        this.scene = this.el.sceneEl;

        this.target =
          document.querySelector("#office-target");

        this.bin =
          document.querySelector("#bin");

        this.dragSurface =
          document.querySelector("#drag-surface");

        this.dragging = false;
        this.completed = false;

        this.startPosition = {
          x: -0.38,
          y: 0.18,
          z: 0.12
        };

        this.pointer = new THREE.Vector2();
        this.raycaster = new THREE.Raycaster();

        this.handlePointerDown =
          this.handlePointerDown.bind(this);

        this.handlePointerMove =
          this.handlePointerMove.bind(this);

        this.handlePointerUp =
          this.handlePointerUp.bind(this);

        /*
         * Wait until A-Frame has created its canvas.
         */
        this.scene.addEventListener("renderstart", () => {
          this.canvas = this.scene.canvas;

          this.canvas.addEventListener(
            "pointerdown",
            this.handlePointerDown
          );

          this.canvas.addEventListener(
            "pointermove",
            this.handlePointerMove
          );

          this.canvas.addEventListener(
            "pointerup",
            this.handlePointerUp
          );

          this.canvas.addEventListener(
            "pointercancel",
            this.handlePointerUp
          );
        });
      },

      /*
       * Convert the screen position into normalised
       * coordinates used by the Three.js raycaster.
       */
      updatePointer: function (event) {
        const rectangle =
          this.canvas.getBoundingClientRect();

        this.pointer.x =
          ((event.clientX - rectangle.left) /
            rectangle.width) * 2 - 1;

        this.pointer.y =
          -(
            (event.clientY - rectangle.top) /
            rectangle.height
          ) * 2 + 1;
      },

      /*
       * Check whether the pointer is currently
       * positioned over the paper.
       */
      isPointerOverPaper: function (event) {
        this.updatePointer(event);

        this.raycaster.setFromCamera(
          this.pointer,
          this.scene.camera
        );

        const intersections =
          this.raycaster.intersectObject(
            this.el.object3D,
            true
          );

        return intersections.length > 0;
      },

      /*
       * Find the position where the pointer intersects
       * the invisible plane over the target image.
       */
      getTargetPosition: function (event) {
        this.updatePointer(event);

        this.raycaster.setFromCamera(
          this.pointer,
          this.scene.camera
        );

        const surfaceObject =
          this.dragSurface.getObject3D("mesh");

        if (!surfaceObject) {
          return null;
        }

        const intersections =
          this.raycaster.intersectObject(
            surfaceObject,
            true
          );

        if (intersections.length === 0) {
          return null;
        }

        /*
         * Intersection points are initially in world
         * coordinates. Convert them into coordinates
         * relative to the tracked image target.
         */
        const localPoint =
          intersections[0].point.clone();

        this.target.object3D.worldToLocal(localPoint);

        return localPoint;
      },

      handlePointerDown: function (event) {
        if (this.completed) {
          return;
        }

        if (!this.isPointerOverPaper(event)) {
          return;
        }

        event.preventDefault();

        this.dragging = true;

        if (this.canvas.setPointerCapture) {
          this.canvas.setPointerCapture(
            event.pointerId
          );
        }

        this.el.removeAttribute("animation");

        this.el.setAttribute(
          "scale",
          "1.15 1.15 1.15"
        );

        updateMessage(
          "Drag the paper and release it inside the bin."
        );
      },

      handlePointerMove: function (event) {
        if (!this.dragging || this.completed) {
          return;
        }

        event.preventDefault();

        const position =
          this.getTargetPosition(event);

        if (!position) {
          return;
        }

        /*
         * Keep the paper within the visible target area.
         */
        const x =
          THREE.MathUtils.clamp(
            position.x,
            -0.62,
            0.62
          );

        const y =
          THREE.MathUtils.clamp(
            position.y,
            -0.38,
            0.42
          );

        this.el.setAttribute(
          "position",
          `${x} ${y} 0.12`
        );
      },

      handlePointerUp: function (event) {
        if (!this.dragging || this.completed) {
          return;
        }

        event.preventDefault();

        this.dragging = false;

        if (
          this.canvas.releasePointerCapture &&
          this.canvas.hasPointerCapture(event.pointerId)
        ) {
          this.canvas.releasePointerCapture(
            event.pointerId
          );
        }

        const paperPosition =
          this.el.getAttribute("position");

        const binPosition =
          this.bin.getAttribute("position");

        const horizontalDistance =
          paperPosition.x - binPosition.x;

        const verticalDistance =
          paperPosition.y - binPosition.y;

        const distance =
          Math.sqrt(
            horizontalDistance * horizontalDistance +
            verticalDistance * verticalDistance
          );

        /*
         * The paper is accepted when it is sufficiently
         * close to the centre of the bin.
         */
        if (distance < 0.25) {
          this.completeTask();
        } else {
          this.returnPaper();
        }
      },

      returnPaper: function () {
        updateMessage(
          "Not quite! Try dropping the paper inside the bin."
        );

        this.el.setAttribute(
          "animation",
          {
            property: "position",
            to: `${this.startPosition.x} ${this.startPosition.y} ${this.startPosition.z}`,
            dur: 450,
            easing: "easeOutQuad"
          }
        );

        this.el.setAttribute(
          "animation__scale",
          {
            property: "scale",
            to: "1 1 1",
            dur: 250
          }
        );
      },

      completeTask: function () {
        this.completed = true;

        const binPosition =
          this.bin.getAttribute("position");

        updateMessage(
          "Excellent! The paper was placed in the bin."
        );

        /*
         * Move the paper to the centre of the bin.
         */
        this.el.setAttribute(
          "animation",
          {
            property: "position",
            to: `${binPosition.x} ${binPosition.y} 0.13`,
            dur: 300,
            easing: "easeInQuad"
          }
        );

        /*
         * Make the paper disappear into the bin.
         */
        this.el.setAttribute(
          "animation__scale",
          {
            property: "scale",
            to: "0 0 0",
            dur: 500,
            delay: 250,
            easing: "easeInBack"
          }
        );

        /*
         * Animate the bin to provide feedback.
         */
        this.bin.setAttribute(
          "animation",
          {
            property: "scale",
            from: "1 1 1",
            to: "1.25 1.25 1.25",
            dur: 200,
            dir: "alternate",
            loop: 2
          }
        );

        document.getElementById(
          "progress"
        ).textContent = "Tasks completed: 1/1";

        document.getElementById(
          "success"
        ).style.display = "block";

        document.getElementById(
          "drop-zone"
        ).setAttribute(
          "visible",
          "false"
        );
      },

      remove: function () {
        if (!this.canvas) {
          return;
        }

        this.canvas.removeEventListener(
          "pointerdown",
          this.handlePointerDown
        );

        this.canvas.removeEventListener(
          "pointermove",
          this.handlePointerMove
        );

        this.canvas.removeEventListener(
          "pointerup",
          this.handlePointerUp
        );

        this.canvas.removeEventListener(
          "pointercancel",
          this.handlePointerUp
        );
      }
    });

    function updateMessage(text) {
      const message =
        document.getElementById("message");

      if (message) {
        message.textContent = text;
      }
    }
  </script>
</head>

<body>
  <div id="ui">
    <div id="title">
      Terrible Day at the Office
    </div>

    <div id="message">
      Starting MindAR…
    </div>

    <div id="progress">
      Tasks completed: 0/1
    </div>

    <div id="success">
      ✓ The workspace is a little cleaner!
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/office-target.mind; warmupTolerance: 1; missTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>

    <a-entity
      id="office-target"
      mindar-image-target="targetIndex: 0"
    >
      <!-- Invisible surface used to calculate dragging positions -->
      <a-plane
        id="drag-surface"
        position="0 0 0.03"
        width="1.45"
        height="0.95"
        material="
          color: white;
          transparent: true;
          opacity: 0;
          depthWrite: false;
        "
      >
      </a-plane>

      <!-- Instruction -->
      <a-text
        value="Drag the paper into the bin"
        color="#111111"
        align="center"
        width="1.8"
        position="0 0.52 0.08"
      >
      </a-text>

      <!-- Paper -->
      <a-entity
        id="paper"
        position="-0.38 0.18 0.12"
        drag-paper
      >
        <a-plane
          width="0.30"
          height="0.22"
          color="#fffdf2"
          material="
            shader: standard;
            roughness: 0.8;
          "
          shadow
        >
        </a-plane>

        <!-- Lines printed on the paper -->
        <a-plane
          width="0.20"
          height="0.012"
          color="#4d79a8"
          position="0 0.055 0.006"
        >
        </a-plane>

        <a-plane
          width="0.20"
          height="0.012"
          color="#4d79a8"
          position="0 0.015 0.006"
        >
        </a-plane>

        <a-plane
          width="0.20"
          height="0.012"
          color="#4d79a8"
          position="0 -0.025 0.006"
        >
        </a-plane>

        <a-plane
          width="0.13"
          height="0.012"
          color="#4d79a8"
          position="-0.035 -0.065 0.006"
        >
        </a-plane>
      </a-entity>

      <!-- Bin -->
      <a-entity
        id="bin"
        position="0.42 -0.17 0.11"
      >
        <a-cylinder
          radius="0.15"
          height="0.27"
          color="#555555"
          material="
            metalness: 0.2;
            roughness: 0.7;
          "
        >
        </a-cylinder>

        <!-- Dark opening of the bin -->
        <a-circle
          radius="0.135"
          color="#151515"
          rotation="-90 0 0"
          position="0 0.14 0"
        >
        </a-circle>
      </a-entity>

      <!-- Highlighted drop zone -->
      <a-ring
        id="drop-zone"
        radius-inner="0.18"
        radius-outer="0.22"
        color="#22aa55"
        position="0.42 -0.17 0.075"
        animation="
          property: scale;
          from: 0.9 0.9 0.9;
          to: 1.15 1.15 1.15;
          dur: 750;
          dir: alternate;
          loop: true;
          easing: easeInOutSine;
        "
      >
      </a-ring>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener(
      "DOMContentLoaded",
      () => {
        const scene =
          document.querySelector("a-scene");

        const target =
          document.querySelector("#office-target");

        scene.addEventListener(
          "arReady",
          () => {
            updateMessage(
              "Camera ready. Show the office poster."
            );
          }
        );

        scene.addEventListener(
          "arError",
          () => {
            updateMessage(
              "MindAR could not start."
            );
          }
        );

        target.addEventListener(
          "targetFound",
          () => {
            updateMessage(
              "Office detected! Drag the paper into the bin."
            );
          }
        );

        target.addEventListener(
          "targetLost",
          () => {
            updateMessage(
              "Office lost. Show the complete poster again."
            );
          }
        );
      }
    );
  </script>
</body>
</html>
